name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the app version comes from `git describe` and the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      # Every build (CI and local) signs with the same debug key, so a new APK installs
      # over the old one without uninstalling and the app's data survives.
      - name: Install shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not available; APK will be signed with a throwaway key."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "HAVE_SHARED_KEY=true" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK is signed with the shared debug key
        if: env.HAVE_SHARED_KEY == 'true'
        env:
          EXPECTED_SHA256: 7dd8f376357e3f886a4aa9640cce6e6e80aba2b751d46a1b6590904e884ff1ea
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Signer SHA-256: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED_SHA256" ] || { echo "::error::APK signed with unexpected key"; exit 1; }

      # Same rule as versionName in app/build.gradle.kts.
      - name: Name APK with version
        run: |
          VERSION=$(git describe --tags --match 'v[0-9]*' --always --dirty)
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/sleeptight-$VERSION-debug.apk"
          echo "### SleepTight $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sleeptight-${{ env.VERSION }}-debug
          path: dist/*.apk
          retention-days: 30
